openapi: "3.0.3"
info:
  title: Maknoon PQC API
  version: "1.0"
  description: |
    Enterprise Post-Quantum Cryptography REST API.
    All endpoints require TLS 1.3 (PQ-hybrid ML-KEM preferred).
    Rate limit: 5 requests/second with burst of 10.
  contact:
    name: al-Zamakhshari/maknoon
    url: https://github.com/al-Zamakhshari/maknoon

servers:
  - url: https://localhost:8443
    description: Local PQC API server

tags:
  - name: health
    description: Service health
  - name: vault
    description: Secure credential storage
  - name: identity
    description: PQC identity management
  - name: crypto
    description: Encryption, decryption, and dispersal
  - name: network
    description: P2P tunnels and connectivity
  - name: audit
    description: Forensic audit log

paths:
  /v1/health:
    get:
      tags: [health]
      summary: Service health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusResponse"

  # --- Vault ---

  /v1/vault/get:
    post:
      tags: [vault]
      summary: Retrieve a secret from a vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vault, service, passphrase]
              properties:
                vault:      { type: string, example: default }
                service:    { type: string, example: MY_API_KEY }
                passphrase: { type: string, format: password }
      responses:
        "200":
          description: Secret entry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VaultEntry"
        "500": { $ref: "#/components/responses/Error" }

  /v1/vault/set:
    post:
      tags: [vault]
      summary: Store a secret in a vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vault, service, password, passphrase]
              properties:
                vault:      { type: string }
                service:    { type: string }
                username:   { type: string }
                password:   { type: string, format: password }
                note:       { type: string }
                passphrase: { type: string, format: password }
                overwrite:  { type: boolean, default: false }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/vault/list:
    post:
      tags: [vault]
      summary: List all services in a vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vault, passphrase]
              properties:
                vault:      { type: string }
                passphrase: { type: string, format: password }
      responses:
        "200":
          description: List of vault entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:  { type: string }
                  entries: { type: array, items: { $ref: "#/components/schemas/VaultListEntry" } }
        "500": { $ref: "#/components/responses/Error" }

  /v1/vault/delete:
    post:
      tags: [vault]
      summary: Delete a vault file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vault]
              properties:
                vault: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/vault/status:
    get:
      tags: [vault]
      summary: Get institutional vault metadata
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vault status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultResult" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/vault/rotate:
    post:
      tags: [vault]
      summary: Rotate the vault master passphrase
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [vault, old_passphrase, new_passphrase]
              properties:
                vault:           { type: string }
                old_passphrase:  { type: string, format: password }
                new_passphrase:  { type: string, format: password }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/vault/init-institutional:
    post:
      tags: [vault]
      summary: Initialize a quorum-governed institutional vault
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, threshold, shares, peer_ids, passphrase]
              properties:
                name:       { type: string }
                threshold:  { type: integer, minimum: 1 }
                shares:     { type: integer, minimum: 1 }
                peer_ids:   { type: array, items: { type: string } }
                passphrase: { type: string, format: password }
      responses:
        "200":
          description: Vault initialized with shard mnemonics
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VaultResult" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/vault/check-shards:
    post:
      tags: [vault]
      summary: Validate vault recovery shards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mnemonics]
              properties:
                mnemonics: { type: array, items: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "500": { $ref: "#/components/responses/Error" }

  # --- Identity ---

  /v1/identity/keygen:
    post:
      tags: [identity]
      summary: Generate a new PQC identity keypair
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:       { type: string, example: alice }
                passphrase: { type: string, format: password }
                profile:    { type: string, enum: [nist, conservative], default: nist }
      responses:
        "200":
          description: Identity created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityResult" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/identity/list:
    get:
      tags: [identity]
      summary: List all local identity names
      responses:
        "200":
          description: Identity list
          content:
            application/json:
              schema:
                type: object
                properties:
                  identities: { type: array, items: { type: string } }
        "500": { $ref: "#/components/responses/Error" }

  /v1/identity/info:
    get:
      tags: [identity]
      summary: Get details about a local identity
      parameters:
        - in: query
          name: name
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Identity info
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IdentityInfo" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/identity/delete:
    post:
      tags: [identity]
      summary: Permanently delete a local identity (securely shreds private keys)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/identity/sign:
    post:
      tags: [identity]
      summary: Sign data with an ML-DSA-87 private key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, private_key]
              properties:
                data:        { type: string, format: byte, description: "Base64-encoded data to sign" }
                private_key: { type: string, format: byte, description: "Base64-encoded ML-DSA-87 private key" }
      responses:
        "200":
          description: Signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature: { type: string, format: byte }
        "500": { $ref: "#/components/responses/Error" }

  /v1/identity/verify:
    post:
      tags: [identity]
      summary: Verify a PQC signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [data, signature, public_key]
              properties:
                data:       { type: string, format: byte }
                signature:  { type: string, format: byte }
                public_key: { type: string, format: byte }
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid: { type: boolean }
        "500": { $ref: "#/components/responses/Error" }

  /v1/identity/sign/aggregate:
    post:
      tags: [identity]
      summary: Aggregate multiple signatures for threshold verification
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [signatures]
              properties:
                signatures: { type: array, items: { type: string, format: byte } }
      responses:
        "200":
          description: Aggregated signature
          content:
            application/json:
              schema:
                type: object
                properties:
                  signature: { type: string, format: byte }
        "500": { $ref: "#/components/responses/Error" }

  /v1/identity/resolve:
    get:
      tags: [identity]
      summary: Resolve a handle or petname to a PQC public key via registry
      parameters:
        - in: query
          name: handle
          required: true
          schema: { type: string, example: "@alice" }
      responses:
        "200":
          description: Resolved public key
          content:
            application/json:
              schema:
                type: object
                properties:
                  public_key: { type: string, description: "Hex-encoded ML-KEM public key" }
        "500": { $ref: "#/components/responses/Error" }

  # --- Crypto & Dispersal ---

  /v1/crypto/encrypt:
    post:
      tags: [crypto]
      summary: Encrypt a file (passphrase or public-key based)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, output]
              properties:
                input:      { type: string, description: "Source file path (must be in /tmp)" }
                output:     { type: string, description: "Output file path (must be in /tmp)" }
                passphrase: { type: string, format: password }
                recipient:  { type: string, description: "Hex public key or @handle for asymmetric encryption" }
      responses:
        "200":
          description: Encryption result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  output: { type: string }
                  flags:  { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/crypto/decrypt:
    post:
      tags: [crypto]
      summary: Decrypt a Maknoon-encrypted file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input, output]
              properties:
                input:      { type: string, description: "Source .makn file path (must be in /tmp)" }
                output:     { type: string, description: "Output file path (must be in /tmp)" }
                passphrase: { type: string, format: password }
                priv_key:   { type: string, description: "Hex-encoded ML-KEM private key for asymmetric decryption" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/crypto/fragment:
    post:
      tags: [crypto]
      summary: Fragment a file into Reed-Solomon shards for RAID-for-Privacy dispersal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:         { type: string, description: "Source file (must be in /tmp)" }
                output:        { type: string, description: "Output directory (must be in /tmp)" }
                data_shards:   { type: integer, default: 5, minimum: 1 }
                parity_shards: { type: integer, default: 3, minimum: 1 }
                sign_with:     { type: string, description: "Path to ML-DSA signing key" }
                passphrase:    { type: string, format: password }
      responses:
        "200":
          description: Fragmentation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:    { type: string }
                  shards:    { type: integer }
                  directory: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/crypto/reassemble:
    post:
      tags: [crypto]
      summary: Reassemble fragments back into the original file
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input_dir, output]
              properties:
                input_dir:      { type: string, description: "Fragment directory (must be in /tmp)" }
                output:         { type: string, description: "Output file path (must be in /tmp)" }
                authorized_key: { type: string, format: byte, description: "Base64 ML-DSA public key for signature verification" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/crypto/wrap:
    post:
      tags: [crypto]
      summary: Wrap a DEK using ML-KEM envelope encryption (KMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [public_key]
              properties:
                public_key: { type: string, format: byte, description: "Base64 ML-KEM public key" }
      responses:
        "200":
          description: Wrapped key material
          content:
            application/json:
              schema:
                type: object
                properties:
                  wrapped_key: { type: string, format: byte }
                  plaintext:   { type: string, format: byte }
        "500": { $ref: "#/components/responses/Error" }

  /v1/crypto/unwrap:
    post:
      tags: [crypto]
      summary: Unwrap a DEK using ML-KEM private key (KMS)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [wrapped_key, private_key]
              properties:
                wrapped_key: { type: string, format: byte }
                private_key: { type: string, format: byte, description: "Base64 ML-KEM private key" }
      responses:
        "200":
          description: Unwrapped plaintext DEK
          content:
            application/json:
              schema:
                type: object
                properties:
                  plaintext: { type: string, format: byte }
        "500": { $ref: "#/components/responses/Error" }

  # --- Network ---

  /v1/network/tunnel/start:
    post:
      tags: [network]
      summary: Establish a PQC L4 tunnel (with optional Reed-Solomon lane striping)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [remote_endpoint]
              properties:
                remote_endpoint: { type: string, example: "gateway.internal:4433" }
                local_port:      { type: integer, default: 1080 }
                data_lanes:      { type: integer, default: 0, description: "0 = single lane" }
                parity_lanes:    { type: integer, default: 0 }
                p2p_mode:        { type: boolean, default: false }
                identity:        { type: string, description: "Identity name for P2P mode" }
      responses:
        "200":
          description: Tunnel status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TunnelStatus" }
        "500": { $ref: "#/components/responses/Error" }

  /v1/network/tunnel/stop:
    post:
      tags: [network]
      summary: Stop the active tunnel
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "500": { $ref: "#/components/responses/Error" }

  # --- Audit ---

  /v1/audit/export:
    get:
      tags: [audit]
      summary: Export the cryptographic operation audit log
      responses:
        "200":
          description: Audit entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AuditEntry" }
        "500": { $ref: "#/components/responses/Error" }

components:
  schemas:
    StatusResponse:
      type: object
      properties:
        status:  { type: string, example: ok }
        version: { type: string }

    VaultEntry:
      type: object
      properties:
        service:  { type: string }
        username: { type: string }
        password: { type: string }
        note:     { type: string }

    VaultListEntry:
      type: object
      properties:
        service:  { type: string }
        username: { type: string }
        note:     { type: string }

    VaultResult:
      type: object
      properties:
        status:           { type: string }
        message:          { type: string }
        vault:            { type: string }
        threshold:        { type: integer }
        shares:           { type: array, items: { type: string } }
        is_institutional: { type: boolean }
        quorum_peers:     { type: array, items: { type: string } }

    IdentityResult:
      type: object
      properties:
        status:    { type: string }
        base_name: { type: string }
        base_path: { type: string }

    IdentityInfo:
      type: object
      properties:
        name:      { type: string }
        kem_pub:   { type: string, description: "Hex-encoded ML-KEM-768 public key" }
        sig_pub:   { type: string, description: "Hex-encoded ML-DSA-87+Ed25519 public key bundle" }
        peer_id:   { type: string, description: "libp2p PeerID derived from Ed25519 component" }
        nostr_pub: { type: string, description: "Hex-encoded secp256k1 Nostr transport public key (ephemeral, derived)" }

    TunnelStatus:
      type: object
      properties:
        active:          { type: boolean }
        local_address:   { type: string }
        remote_endpoint: { type: string }
        handshake_time:  { type: string, format: date-time }
        data_lanes:      { type: integer }
        parity_lanes:    { type: integer }
        healthy_lanes:   { type: integer }

    AuditEntry:
      type: object
      properties:
        timestamp: { type: string, format: date-time }
        action:    { type: string }
        status:    { type: string }
        meta:      { type: object }
        prev_hash: { type: string }
        signature: { type: string }

    Error:
      type: object
      properties:
        error: { type: string }

  responses:
    Success:
      description: Operation succeeded
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, example: success }

    BadRequest:
      description: Invalid request parameters
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

    Error:
      description: Internal server error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
