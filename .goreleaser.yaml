# .goreleaser.yaml
# Documentation at https://goreleaser.com
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
    main: ./cmd/maknoon/main.go
    binary: maknoon
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X github.com/al-Zamakhshari/maknoon/pkg/crypto.Version={{.Version}}

archives:
  - formats: [tar.gz]
    # this name template makes the result look like maknoon_1.0.0_darwin_arm64.tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}
    files:
      - man/
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: 'checksums.txt'

# cosign signing placeholder — add back once cosign is configured in CI:
# signs:
#   - cmd: cosign
#     env: [COSIGN_EXPERIMENTAL=1]
#     args: [sign-blob, --output-signature=${signature}, --output-certificate=${certificate}, ${artifact}]
#     artifacts: checksum

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Bug Fixes
      regexp: '^fix'
      order: 1
    - title: Security
      regexp: '^(sec|security)'
      order: 2
    - title: Other
      order: 999
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - Merge pull request
      - Merge branch

# Native Linux packages — .deb (Debian/Ubuntu), .rpm (Fedora/RHEL), .apk (Alpine)
nfpms:
  - id: maknoon
    package_name: maknoon
    vendor: al-Zamakhshari
    homepage: https://github.com/al-Zamakhshari/maknoon
    maintainer: Ahmed Khallaf <akhallaf@gmail.com>
    description: |
      Post-quantum cryptography CLI and MCP server.
      Hybrid ML-KEM/X25519 encryption, ML-DSA-87 signatures,
      encrypted vault with Argon2id, and identity publishing via WKD/DNS.
      Single static binary with no runtime dependencies.
    license: MIT
    formats:
      - deb
      - rpm
      - apk
    bindir: /usr/bin
    section: utils
    priority: optional
    contents:
      - src: ./man/*.1
        dst: /usr/share/man/man1/
        file_info:
          mode: 0644
      # mkn → maknoon short alias
      - src: /usr/bin/maknoon
        dst: /usr/bin/mkn
        type: symlink
      # systemd unit — deb and rpm only (Alpine uses OpenRC, not systemd)
      - src: ./deploy/systemd/maknoon.service
        dst: /lib/systemd/system/maknoon.service
        file_info:
          mode: 0644
        packager: deb
      - src: ./deploy/systemd/maknoon.service
        dst: /lib/systemd/system/maknoon.service
        file_info:
          mode: 0644
        packager: rpm
    scripts:
      postinstall: ./deploy/scripts/postinstall.sh
      preremove: ./deploy/scripts/preremove.sh

# Homebrew Tap configuration (macOS / Linux via Homebrew)
brews:
  - name: maknoon
    repository:
      owner: al-Zamakhshari
      name: homebrew-tap
    directory: Formula
    homepage: "https://github.com/al-Zamakhshari/maknoon"
    description: "Post-quantum cryptography CLI and MCP server. Hybrid ML-KEM/X25519 encryption, ML-DSA-87 signatures, encrypted vault, and identity publishing via WKD/DNS."
    license: "MIT"
    test: |
      system "#{bin}/maknoon --version"
    install: |
      bin.install "maknoon"
      man1.install Dir["man/*.1"]
      bin.install_symlink bin/"maknoon" => "mkn"
