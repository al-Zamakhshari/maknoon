services:
  # The Recovery Node (Initiates recovery)
  recovery-node:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.mission
    environment:
      - MAKNOON_AGENT_MODE=1
      - MAKNOON_PASSPHRASE=quorum-pass
    command: sleep 3600
    networks:
      - quorum-net

  # 4 Guardian nodes holding shards
  guardian-1:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.mission
    environment:
      - MAKNOON_AGENT_MODE=1
      - MAKNOON_PASSPHRASE=quorum-pass
    user: "root"
    command: sh -c "su-exec maknoon maknoon keygen --no-password -o g1 && sleep 3600"
    networks:
      - quorum-net

  guardian-2:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.mission
    environment:
      - MAKNOON_AGENT_MODE=1
      - MAKNOON_PASSPHRASE=quorum-pass
    user: "root"
    command: sh -c "su-exec maknoon maknoon keygen --no-password -o g2 && sleep 3600"
    networks:
      - quorum-net

  guardian-3:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.mission
    environment:
      - MAKNOON_AGENT_MODE=1
      - MAKNOON_PASSPHRASE=quorum-pass
    user: "root"
    command: sh -c "su-exec maknoon maknoon keygen --no-password -o g3 && sleep 3600"
    networks:
      - quorum-net

  guardian-4:
    build:
      context: ../../
      dockerfile: deploy/docker/Dockerfile.mission
    environment:
      - MAKNOON_AGENT_MODE=1
      - MAKNOON_PASSPHRASE=quorum-pass
    user: "root"
    command: sh -c "su-exec maknoon maknoon keygen --no-password -o g4 && sleep 3600"
    networks:
      - quorum-net

networks:
  quorum-net:
    internal: false
