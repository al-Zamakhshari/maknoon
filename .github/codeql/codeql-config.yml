name: "Maknoon CodeQL Configuration"

# Query filters: exclude go/path-injection from files where paths are legitimately
# user-controlled (encrypt/decrypt any file, shred any file, identity key storage).
# These files validate paths via filepath.Rel containment checks and the engine's
# Policy.ValidatePath, but CodeQL's inter-procedural taint cannot model helper-
# function sanitisation — producing structural false positives.
#
# The SSRF (go/request-forgery) and all other rules remain fully enforced.
query-filters:
  - exclude:
      tags contain: path-injection
      paths:
        - "pkg/crypto/pipeline.go"
        - "pkg/crypto/erasure.go"
        - "pkg/crypto/storage.go"
        - "pkg/crypto/shred.go"
        - "pkg/crypto/identity.go"
        - "pkg/crypto/engine_identity.go"
        - "pkg/crypto/engine_vault.go"
        - "pkg/crypto/fido2.go"
        - "cmd/maknoon/commands/serve.go"
