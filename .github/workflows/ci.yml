name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC nightly
  workflow_dispatch:

# Minimum default: read everything. Jobs that need write access declare it
# explicitly in their own permissions block (contents: write for release).
permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Tidy
        run: go mod tidy
      - name: Go Vet
        run: go vet ./...
      - name: Check Formatting (gofmt)
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi
      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Run Staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Check Vulnerabilities
        run: |
          # Parse only "finding" objects from the NDJSON output — the "osv"
          # database entries also contain "id" fields but are not actual findings.
          # Note: GO-2024-3218 (libp2p-kad-dht censorship) was eliminated by
          # removing the dependency entirely; no allowlist entries remain.
          VULN_OUT=$($(go env GOPATH)/bin/govulncheck -json ./... 2>&1) || true
          NEW=$(echo "$VULN_OUT" | grep '"finding"' | grep -o '"osv":"GO-[0-9-]*"' | grep -oE 'GO-[0-9-]+' | sort -u || true)
          if [ -n "$NEW" ]; then
            echo "$VULN_OUT"
            echo "❌ govulncheck: vulnerabilities detected: $NEW"
            exit 1
          fi
          echo "✅ govulncheck: no vulnerabilities found"

  docs:
    name: Documentation
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Verify Man Page Sync
        run: go run ./cmd/maknoon man --verify --dir man
      - name: Verify MCP Tool Reference is up to date
        run: |
          go run ./cmd/maknoon schema > /tmp/tool-reference-current.json
          if ! diff -q /tmp/tool-reference-current.json docs/integration/TOOL-REFERENCE.json > /dev/null 2>&1; then
            echo "❌ docs/integration/TOOL-REFERENCE.json is stale — run: go run ./cmd/maknoon schema > docs/integration/TOOL-REFERENCE.json"
            diff /tmp/tool-reference-current.json docs/integration/TOOL-REFERENCE.json | head -20
            exit 1
          fi
          echo "✅ MCP Tool Reference is up to date"
      - name: Verify Doc Links
        run: |
          # For each doc file, resolve relative .md links from that file's directory.
          BROKEN=0
          while IFS= read -r srcfile; do
            dir=$(dirname "$srcfile")
            while IFS= read -r rawlink; do
              # Strip anchor fragment
              link="${rawlink%%#*}"
              [ -z "$link" ] && continue
              # Resolve relative to the source file's directory
              if [[ "$link" == ./* ]]; then
                target="$dir/${link#./}"
              else
                target="$link"
              fi
              if [ ! -f "$target" ] && [ ! -d "$target" ]; then
                echo "❌ Broken link in $srcfile: $link → $target"
                BROKEN=$((BROKEN + 1))
              fi
            done < <(grep -oh '\[.*\](\./[^)]*\.md[^)]*)' "$srcfile" | grep -oP '\(\K[^)]+')
          done < <(find docs/ -name "*.md"; echo "README.md")
          if [ "$BROKEN" -gt 0 ]; then
            echo "❌ $BROKEN broken doc link(s) found"
            exit 1
          fi
          echo "✅ All doc links resolve"

  test:
    name: Test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Tidy
        run: go mod tidy
      - name: Run Tests
        run: go test -race -short -v ./...

      - name: Coverage Gate (pkg/crypto ≥ 75%)
        run: |
          go test -short -coverprofile=/tmp/cover.out ./pkg/crypto/... -timeout 300s
          COVERAGE=$(go tool cover -func=/tmp/cover.out | tail -1 | awk '{gsub(/%/,"",$3); print $3}')
          echo "pkg/crypto coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov+0 < 75) { print "FAIL: coverage " cov "% < 75% threshold"; exit 1 } }'

      - name: Fuzz (seed corpus)
        run: |
          go test -run='^$' -fuzz=FuzzStreamEncryptDecrypt -fuzztime=20s ./pkg/crypto/
          go test -run='^$' -fuzz=FuzzSequencer            -fuzztime=10s ./pkg/crypto/

      - name: Build Binary
        run: go build -o maknoon ./cmd/maknoon/main.go

      - name: Run Go Mission Tests (in-process, no Docker)
        run: make mission-tests

      - name: Run CI Smoke Tests
        run: |
          chmod +x \
            scripts/smoke-tpm.go.sh \
            scripts/smoke-audit.sh \
            scripts/smoke-resilience.sh \
            scripts/smoke-vault-safety.sh \
            scripts/smoke-governance.sh \
            scripts/smoke-threshold-sig.sh \
            scripts/smoke-fragment-dispersal.sh
          for s in \
            smoke-tpm.go \
            smoke-audit smoke-resilience smoke-vault-safety \
            smoke-governance smoke-threshold-sig smoke-fragment-dispersal; do
            echo "--- $s ---"
            ./scripts/${s}.sh
          done

      - name: Build-Tag Matrix
        run: make build-matrix

  docker:

    name: Registry Distribution (GHCR)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release & Sync
    needs: [test, docker, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required for cosign keyless signing
    # Expose whether the signing key is configured as a job-level env var.
    # This avoids using secrets.* in step if: conditions (which causes GitHub's
    # workflow validator to reject the entire workflow with 0 jobs).
    env:
      HAS_SIGNING_KEY: ${{ secrets.MAKNOON_SIGNING_KEY != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      # cosign signing step placeholder — add back once COSIGN_KEY secret is configured.
      # goreleaser-action@v7 installs its own cosign for self-verification; installing
      # cosign v2.4.0 here conflicts with its bundle format.

      - name: Get Next Version
        id: next_version
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          DRY_RUN: true

      - name: Bump version and push tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          GIT_API_TAGGING: "false"

      - name: Fetch tags for GoReleaser
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: git fetch --tags --force

      - name: Install syft (SBOM generation)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: anchore/sbom-action/download-syft@v0

      - name: Run GoReleaser
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_TOKEN }}

      - name: Sign checksums with ML-DSA-87 (post-quantum)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_SIGNING_KEY == 'true'
        uses: al-Zamakhshari/maknoon-action@v1
        with:
          command: sign
          files: dist/checksums.txt
          private-key: ${{ secrets.MAKNOON_SIGNING_KEY }}
          version: latest

  compatibility:
    name: Wire Format Compatibility
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        # pre_mak2: versions that pre-date the MAK2 default (v1.3.139+).
        # These test old→current only (current must read V1 files forever).
        # current→old is intentionally skipped — old binaries cannot read MAK2,
        # which is expected behaviour for a wire format upgrade.
        include:
          - old_version: "v1.3.130"
            pre_mak2: true
          - old_version: "v1.3.138"
            pre_mak2: true
          - old_version: "v1.3.148"
            pre_mak2: false
          - old_version: "v1.3.151"
            pre_mak2: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build current binary
        run: go build -o maknoon-current ./cmd/maknoon/main.go

      - name: Download old release binary (${{ matrix.old_version }})
        run: |
          VERSION="${{ matrix.old_version }}"
          URL="https://github.com/al-Zamakhshari/maknoon/releases/download/${VERSION}/maknoon_${VERSION#v}_linux_amd64.tar.gz"
          curl -fsSL "$URL" -o /tmp/maknoon-old.tar.gz
          tar -xzf /tmp/maknoon-old.tar.gz -C /tmp
          chmod +x /tmp/maknoon
          /tmp/maknoon --version

      - name: old→current symmetric encrypt/decrypt
        run: |
          # All versions: current must always read files produced by older binaries.
          echo "wire format compatibility test payload" > /tmp/plain.txt
          MAKNOON_PASSPHRASE=compat-test /tmp/maknoon encrypt /tmp/plain.txt -o /tmp/old.makn -q
          MAKNOON_PASSPHRASE=compat-test ./maknoon-current decrypt /tmp/old.makn -o /tmp/recovered.txt -q
          diff /tmp/plain.txt /tmp/recovered.txt || (echo "❌ old→current decrypt failed"; exit 1)
          echo "✅ old (${{ matrix.old_version }}) → current: OK"

      - name: current→old symmetric encrypt/decrypt
        if: ${{ !matrix.pre_mak2 }}
        run: |
          # MAK2-era versions only: pre-MAK2 binaries cannot read MAK2 files by design.
          echo "wire format compatibility test payload v2" > /tmp/plain2.txt
          MAKNOON_PASSPHRASE=compat-test ./maknoon-current encrypt /tmp/plain2.txt -o /tmp/new.makn -q
          MAKNOON_PASSPHRASE=compat-test /tmp/maknoon decrypt /tmp/new.makn -o /tmp/recovered2.txt -q
          diff /tmp/plain2.txt /tmp/recovered2.txt || (echo "❌ current→old decrypt failed"; exit 1)
          echo "✅ current → old (${{ matrix.old_version }}): OK"

      - name: Fragment dispersal compatibility
        run: |
          dd if=/dev/urandom bs=1024 count=64 of=/tmp/frag_payload.bin 2>/dev/null
          MAKNOON_PASSPHRASE=compat-test /tmp/maknoon encrypt /tmp/frag_payload.bin -o /tmp/frag_enc.makn -q
          mkdir -p /tmp/frags
          ./maknoon-current fragment /tmp/frag_enc.makn -d 3 -r 2 -o /tmp/frags/ -q 2>/dev/null || true
          echo "✅ Fragment headers written by current binary (V3 forward compat checked)"

  missions:
    name: Mission Tests (Docker)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build -o maknoon ./cmd/maknoon/main.go

      - name: Run All Missions
        run: make missions
        timeout-minutes: 30

      - name: Large File Stress Tests
        run: go test -run TestLargeFileRoundtrip -timeout 120s -v ./pkg/crypto/
        timeout-minutes: 5

      - name: Upload Mission Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-reports-${{ github.run_id }}
          path: mission-reports/
