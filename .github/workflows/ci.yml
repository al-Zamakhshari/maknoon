name: CI/CD

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '0 2 * * *'   # 02:00 UTC nightly
  workflow_dispatch:

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Tidy
        run: go mod tidy
      - name: Go Vet
        run: go vet ./...
      - name: Check Formatting (gofmt)
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not formatted:"
            gofmt -l .
            exit 1
          fi
      - name: Install Staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - name: Run Staticcheck
        run: $(go env GOPATH)/bin/staticcheck ./...
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Check Vulnerabilities
        run: |
          # Parse only "finding" objects from the NDJSON output — the "osv"
          # database entries also contain "id" fields but are not actual findings.
          # Note: GO-2024-3218 (libp2p-kad-dht censorship) was eliminated by
          # removing the dependency entirely; no allowlist entries remain.
          VULN_OUT=$($(go env GOPATH)/bin/govulncheck -json ./... 2>&1) || true
          NEW=$(echo "$VULN_OUT" | grep '"finding"' | grep -o '"osv":"GO-[0-9-]*"' | grep -oE 'GO-[0-9-]+' | sort -u || true)
          if [ -n "$NEW" ]; then
            echo "$VULN_OUT"
            echo "❌ govulncheck: vulnerabilities detected: $NEW"
            exit 1
          fi
          echo "✅ govulncheck: no vulnerabilities found"

  docs:
    name: Documentation
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Verify Man Page Sync
        run: go run ./cmd/maknoon man --verify
      - name: Verify Doc Links
        run: |
          # Extract markdown links from docs/ and README.md, verify each target file exists.
          BROKEN=0
          while IFS= read -r link; do
            # Strip anchor fragment
            target="${link%%#*}"
            [ -z "$target" ] && continue
            if [ ! -f "$target" ] && [ ! -d "$target" ]; then
              echo "❌ Broken link target: $target"
              BROKEN=$((BROKEN + 1))
            fi
          done < <(grep -roh '\[.*\](\./[^)]*\.md[^)]*)' docs/ README.md \
                    | grep -oP '\(\K[^)]+' | sed 's|^\./||' | sort -u)
          if [ "$BROKEN" -gt 0 ]; then
            echo "❌ $BROKEN broken doc link(s) found"
            exit 1
          fi
          echo "✅ All doc links resolve"

  test:
    name: Test
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Tidy
        run: go mod tidy
      - name: Run Tests
        run: go test -race -short -v ./...

      - name: Fuzz (seed corpus)
        run: |
          go test -run='^$' -fuzz=FuzzStreamEncryptDecrypt -fuzztime=20s ./pkg/crypto/
          go test -run='^$' -fuzz=FuzzSequencer            -fuzztime=10s ./pkg/crypto/

      - name: Build Binary
        run: go build -o maknoon ./cmd/maknoon/main.go

      - name: Run Go Mission Tests (in-process, no Docker)
        run: make mission-tests

      - name: Run CI Smoke Tests
        run: |
          chmod +x \
            scripts/smoke-p2p-mcp.sh \
            scripts/smoke-api.sh \
            scripts/smoke-tpm.go.sh \
            scripts/smoke-audit.sh \
            scripts/smoke-resilience.sh \
            scripts/smoke-vault-safety.sh \
            scripts/smoke-governance.sh \
            scripts/smoke-threshold-sig.sh \
            scripts/smoke-fragment-dispersal.sh
          for s in \
            smoke-p2p-mcp smoke-api smoke-tpm.go \
            smoke-audit smoke-resilience smoke-vault-safety \
            smoke-governance smoke-threshold-sig smoke-fragment-dispersal; do
            echo "--- $s ---"
            ./scripts/${s}.sh
          done

      - name: Build-Tag Matrix
        run: make build-matrix

  docker:

    name: Registry Distribution (GHCR)
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=edge,branch=main
            type=sha

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Release & Sync
    needs: [test, docker, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write   # required for cosign keyless signing
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: 'v2.4.0'

      - name: Get Next Version
        id: next_version
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch
          DRY_RUN: true

      - name: Bump version and push tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: anothrNick/github-tag-action@1.75.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WITH_V: true
          DEFAULT_BUMP: patch

      - name: Fetch tags for GoReleaser
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: git fetch --tags --force

      - name: Run GoReleaser
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GORELEASER_TOKEN }}

  missions:
    name: Mission Tests (Docker)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        run: go build -o maknoon ./cmd/maknoon/main.go

      - name: Run All Missions
        run: make missions
        timeout-minutes: 30

      - name: Upload Mission Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mission-reports-${{ github.run_id }}
          path: mission-reports/
